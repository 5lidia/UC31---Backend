<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Alunos</title>
<style>

        body {
            font-family: sans-serif ;
            background-color: white;
            margin: 40px;
        }
        h2 {
            text-align: center;
            color: #333;
        }
        form {
            background-color: #90D1C9;
            border-radius: 20px;
            padding: 20px;
            width: 400px;
            margin: auto;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
        }
        label {
            font-weight: bold;
        }
        input, select {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 15px;
        }
        button {
            background-color: rgb(248, 255, 254);
            color: black;
            padding: 10px;
            width: 100%;
            border-radius: 25px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0d7e71;
        }

</style>
    
</head>
<body>
    <h2>Sistema de Cadastro de Alunos</h2>
    <form method="POST">
        <label>Nome Completo:</label>
        <input type="text" name="nome" placeholder="Digite seu nome">

        <label>E-mail:</label>
        <input type="email" name="email">

        <label>Telefone:</label>
        <input type="text" name="telefone">

        <label>CPF:</label>
        <input type="text" name="cpf">

        <label>Cidade:</label>
        <input type="text" name="cidade">

        <label>Estado:</label>
        <input type="text" name="estado">

        <label>Curso:</label>
        <input type="text" name="curso">

        <label>Idade:</label>
        <input type="text" name="idade">

        <label>Senha:</label>
        <input type="password" name="senha">

        <button type="submit">Cadastrar</button>
    </form>

</body>
</html>
